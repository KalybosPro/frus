[workspace]
resolver = "2"
members = ["crates/*"]
# `templates/app` est un gabarit `cargo generate` (fichiers `{{…}}` non
# compilables) : jamais un membre du workspace.
exclude = ["templates"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wgpu = "22"
winit = "0.30"
taffy = "0.7"
glyphon = "0.6"
cosmic-text = "0.12"
lyon = "1"
# Décodage d'images (PNG/JPEG). Formats limités pour alléger l'arbre de deps.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
env_logger = "0.11"
log = "0.4"

# Profil de dev : compilation plus rapide sans sacrifier l'ergonomie.
[profile.dev]
opt-level = 1

# Les dépendances lourdes (wgpu, naga...) restent optimisées même en dev.
[profile.dev.package."*"]
opt-level = 3

# Profil **Web** : optimise pour la TAILLE du `.wasm` téléchargé (jalon 131).
# Isolé du release natif (qui reste réglé pour la vitesse) — on l'active via
# `cargo build --profile web-release --target wasm32-unknown-unknown`.
[profile.web-release]
inherits = "release"
opt-level = "z"      # priorité à la taille du code (vs "3" = vitesse)
lto = true           # inlining inter-crates + élagage agressif du code mort
codegen-units = 1    # une seule unité : meilleure optimisation (build plus lent)
panic = "abort"      # supprime les tables de déroulement des panics (unwinding)
strip = true         # retire symboles et debuginfo du binaire
