[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# **A single dependency**: the `frus` facade re-exports shell + widgets + `main!` (and
# anyhow/log). frus is not (yet) published on crates.io, so this points at the local
# checkout; once it is published, replace it with:  frus = "0.1"
frus = { path = "{{frus_path}}/crates/frus" }

# Web (wasm): the `frus::main!` macro generates the `#[wasm_bindgen(start)]` entry point.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Android packaging (cargo-apk: `cargo apk run`) ---
[package.metadata.android]
package = "com.example.{{crate_name}}"
build_targets = ["aarch64-linux-android"]
# The launch theme lives here — see `res/values/styles.xml`.
resources = "res"

[package.metadata.android.application]
label = "{{project-name}}"

# The application's own theme, whose only job is the **window background**: what is on
# screen between Android opening the window and the first frame being drawn. Left to the
# platform's, a dark application opens with a full-screen white flash on a device in
# light mode. See `res/values/styles.xml`; it is NoActionBar, which matters for the safe
# area as well (milestone 288).
theme = "@style/LaunchTheme"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

# --- What you ship ---
#
# `cargo apk run` and `cargo run` build in **debug**, and a debug build carries its
# symbols: on Android that is a ~300 MB `.so` where a release one is a few megabytes.
# Build with `--release` for anything that leaves your machine:
#
#     cargo apk build --release        # the APK to install or upload
#     cargo build --release            # the desktop binary
#
# These settings are what make that release build small without costing frame time.
[profile.release]
opt-level = 3        # frames first: a UI is measured in milliseconds
lto = "fat"          # cross-crate inlining, and the dead code goes out with it
codegen-units = 1    # a single unit: better optimisation, slower build
panic = "abort"      # no unwinding tables (cargo ignores this for tests)
strip = true         # symbols and debuginfo out of the shipped binary
