[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"
# The oldest compiler frus builds with. Raise it when you need a newer one.
rust-version = "1.90"
# An application, not a library someone depends on: `cargo publish` refuses it.
publish = false

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# **A single dependency**: the `frus` facade re-exports shell + widgets + `main!` (and
# anyhow/log). To build against a checkout of frus instead of the published crates, see
# "Building against a checkout" in the README.
frus = "0.2"

# Web (wasm): the `frus::main!` macro generates the `#[wasm_bindgen(start)]` entry point.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Android packaging (cargo-apk) ---
#
#     cargo apk run --lib                  # build, install and start on the device (debug)
#     cargo apk build --lib --release      # the APK you ship: target/release/apk/
#
# `--lib` is required: the crate has a library (what Android loads) and a binary (the
# desktop's), and asked for both, cargo-apk panics after writing the APK.
[package.metadata.android]
package = "com.example.{{crate_name}}"
# `arm64-v8a`, what nearly every phone runs. Add "armv7-linux-androideabi" for 32-bit
# devices, "x86_64-linux-android" for the emulator (and `rustup target add` each one).
build_targets = ["aarch64-linux-android"]
# The launch theme lives here — see `res/values/styles.xml`.
resources = "res"

[package.metadata.android.application]
label = "{{project-name}}"
# The launcher icon: the frus logo by default, `res/mipmap-*/ic_launcher.png` — replace those
# five files to change it. (On Android the icon is the manifest's, not the running code's.)
icon = "@mipmap/ic_launcher"

# The application's own theme, whose only job is the **window background**: what is on
# screen between Android opening the window and the first frame being drawn. Left to the
# platform's, a dark application opens with a full-screen white flash on a device in
# light mode. See `res/values/styles.xml`; it is NoActionBar, which matters for the safe
# area as well.
theme = "@style/LaunchTheme"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

# A release APK is signed with **your** key; the debug key only signs debug builds. Make
# one once and keep it out of version control (`.gitignore` already skips `*.keystore`):
#
#     keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000
#
# Then either set `CARGO_APK_RELEASE_KEYSTORE` and `CARGO_APK_RELEASE_KEYSTORE_PASSWORD`
# in the environment (what the release workflow does), or uncomment:
#
# [package.metadata.android.signing.release]
# path = "/absolute/path/to/release.keystore"
# keystore_password = "..."

# --- What you ship ---
#
# `cargo run` and `cargo apk run` build in **debug**, and a debug build carries its
# symbols: on Android that is a ~300 MB `.so` where a release one is a few megabytes.
# Build with `--release` for anything that leaves your machine.
#
# These settings are what make that release build small without costing frame time.
[profile.release]
opt-level = 3        # frames first: a UI is measured in milliseconds
lto = "fat"          # cross-crate inlining, and the dead code goes out with it
codegen-units = 1    # a single unit: better optimisation, slower build
panic = "abort"      # no unwinding tables (cargo ignores this for tests)
strip = true         # symbols and debuginfo out of the shipped binary

# The web's release profile: the `.wasm` is **downloaded**, so here size comes first.
#
#     cargo build --lib --target wasm32-unknown-unknown --profile web-release
[profile.web-release]
inherits = "release"
opt-level = "z"
