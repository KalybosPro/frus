[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"

# Bibliothèque : `rlib` pour le binaire bureau, `cdylib` (le `.so`) pour Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# **Une seule dépendance** : la façade `frus` ré-exporte shell + widgets + `main!` (et
# anyhow/log). frus n'est pas (encore) publié sur crates.io : on référence le checkout
# local ; une fois publié, remplacer par :  frus = "0.1"
frus = { path = "{{frus_path}}/crates/frus" }

# Web (wasm) : la macro `frus::main!` engendre l'entrée `#[wasm_bindgen(start)]`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Empaquetage Android (cargo-apk : `cargo apk run`) ---
[package.metadata.android]
package = "com.example.{{crate_name}}"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application]
label = "{{project-name}}"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
