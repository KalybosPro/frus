# `cargo generate` template for a frus application.
#
#   cargo install cargo-generate       # once
#   cargo generate --path templates/app --name my-app
#
# (From a remote repository: `cargo generate --git <url> templates/app`.)
[template]
description = "A minimal frus application (counter)"

[placeholders]
frus_path = { type = "string", prompt = "Path to your frus checkout (the one containing crates/)", default = "../frus" }
