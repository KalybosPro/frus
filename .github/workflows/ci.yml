name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Logic tests — no GPU, no window. This is the bulk of the suite and the gate
  # that must stay green on every platform.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (headless — everything except the GPU-backed crates)
        run: cargo test --workspace --exclude frus-gpu --exclude frus-test

      - name: Test with optional features (net + json)
        run: cargo test -p frus --features json

  # ---------------------------------------------------------------------------
  # Golden / GPU tests — need a working Vulkan device. On CI that is lavapipe
  # (software Vulkan), whose rasterization differs subtly from real hardware.
  #
  # Only the **goldens** are sensitive to that, so only they are advisory. The rest
  # of the GPU-backed tests — clipping, transforms, batching — assert on numbers and
  # not on pixels, and they are required.
  #
  # This split exists because the old arrangement made the whole job advisory, and a
  # deliberate text-metric change (milestone 289) left 47 goldens red for five
  # milestones with nobody looking. See milestone 294.
  #
  # TODO: once goldens are confirmed stable under lavapipe — most likely by allowing
  # a channel tolerance rather than demanding exact bytes — fold the golden step back
  # in and drop `continue-on-error` from it too.
  # ---------------------------------------------------------------------------
  gpu-test:
    name: GPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Vulkan (lavapipe) and windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan-dev \
            libxkbcommon-dev libwayland-dev libx11-dev
          vulkaninfo --summary || true

      - name: Test (GPU, everything but the goldens — required)
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo test -p frus-gpu
          cargo test -p frus-test --lib
          cargo test -p frus-test --test clip --test multiline_scroll --test transforms

      - name: Goldens (advisory — lavapipe rasterises differently from hardware)
        continue-on-error: true
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test -p frus-test --test goldens

      - name: Upload failed golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: "**/*.actual.png"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Web target — must keep compiling for wasm32.
  # ---------------------------------------------------------------------------
  wasm:
    name: Build wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build frus-hello for the web
        run: cargo build -p frus-hello --target wasm32-unknown-unknown

      - name: Build the network example for the web
        run: cargo build -p frus-fetch-example --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Android target — compiles the shared library against the NDK preinstalled on
  # the runner. Advisory while the NDK setup settles.
  # ---------------------------------------------------------------------------
  android:
    name: Build Android (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      # `--lib` is required, not optional: frus-hello carries both a lib
      # (rlib + cdylib) and a bin target. Without it cargo-apk cannot pick an
      # artifact and panics inside `Artifact::file_name` rather than reporting a
      # useful error. Android loads the cdylib (`android_main`), never the bin.
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-apk --locked
          cargo apk build -p frus-hello --lib

  # ---------------------------------------------------------------------------
  # iOS target. `frus-shell` has explicit platform cfg aliases (`desktop` /
  # `android` / `ios` / `web`, see its build.rs) so that iOS does not fall into the
  # desktop branch and inherit arboard, env_logger and AccessKit.
  #
  # Compiles for the simulator and for a device, without code signing (a plain
  # `cargo build` needs none).
  #
  # Blocking: both targets compile today, so a break here is a real regression.
  # Note this proves iOS *compiles*, not that it *runs* — lifecycle, safe-area
  # insets, IME and soft keyboard are still unwired. See ROADMAP.md.
  # ---------------------------------------------------------------------------
  ios:
    name: Build iOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios-sim, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build frus-hello for ${{ matrix.target }}
        run: cargo build -p frus-hello --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Style. Both are advisory today because the tree carries a pre-existing
  # backlog (see ROADMAP.md → Quality). Clearing it and flipping these to
  # blocking is a welcome first contribution.
  #
  # TODO: after a `cargo fmt --all` pass, drop `continue-on-error` from fmt.
  # TODO: after the clippy backlog is cleared, drop it from clippy and add
  #       `-- -D warnings`.
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo clippy --workspace --all-targets

  # ---------------------------------------------------------------------------
  # Docs must build. The strict pass (broken intra-doc links as errors) is
  # advisory until the existing ~11 link warnings are cleared — see ROADMAP.md.
  #
  # TODO: once clean, fold the strict step into the blocking one.
  # ---------------------------------------------------------------------------
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features

      - name: Strict pass — broken intra-doc links (advisory)
        continue-on-error: true
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
