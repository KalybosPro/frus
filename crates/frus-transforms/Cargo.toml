[package]
name = "frus-transforms"
description = "frus — animated showcase: composed Transform, AspectRatio, FractionallySizedBox"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# An example application, never a crate someone depends on.
publish = false

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
frus-shell = { path = "../frus-shell" }
frus-widgets = { path = "../frus-widgets" }
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
frus-core = { path = "../frus-core" }

# --- Empaquetage Android (cargo-apk) ---
[package.metadata.android]
package = "com.frus.transforms"
build_targets = ["aarch64-linux-android"]
# The launch theme lives here — see `res/values/styles.xml`.
resources = "res"

[package.metadata.android.application]
label = "frus transforms"

# The application's own theme, whose only job is the **window background**: what is on
# screen between Android opening the window and the first frame being drawn. Left to the
# platform's, a dark application opens with a full-screen white flash on a device in
# light mode. See `res/values/styles.xml`; it is NoActionBar, which matters for the safe
# area as well (milestone 288).
theme = "@style/LaunchTheme"

# The configuration changes followed in place (see frus-demo's manifest).
[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"

# The activity enters frus first (milestone 762): frus then answers Android's request for the
# application's saved state itself, on every Android version, so state restoration works
# before Android 10 too. Needs a frus newer than 0.5.0, which defines that function.
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.func_name"
value = "frus_native_activity_on_create"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
