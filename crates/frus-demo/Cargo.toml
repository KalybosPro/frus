[package]
name = "frus-demo"
description = "frus — example application (task list), a consumer of the framework"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# An example application, never a crate someone depends on.
publish = false

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

# Both binaries are named because naming one turns auto-discovery off for the other.
[[bin]]
name = "frus-demo"
path = "src/bin/frus-demo.rs"

# `required-features`, or `--all-targets` builds it without the feature its module is
# gated behind and fails.
[[bin]]
name = "shots"
path = "src/bin/shots.rs"
required-features = ["shots"]

[features]
# The tool that renders the README's pictures. Off by default: it pulls the test
# harness and a GIF encoder into a crate that otherwise needs neither.
shots = ["dep:frus-test", "dep:gif"]

[dependencies]
frus-shell = { path = "../frus-shell" }
frus-widgets = { path = "../frus-widgets" }
frus-l10n = { path = "../frus-l10n" }
frus-image = { path = "../frus-image" }
anyhow.workspace = true
log.workspace = true
# `--features shots` only: rendering frames offscreen, and packing them into a GIF.
frus-test = { path = "../frus-test", optional = true }
gif = { version = "0.13", optional = true }

# Web (wasm): the `frus_shell::main!` macro generates the `#[wasm_bindgen(start)]` entry point
# and names `wasm_bindgen`; the tasks are kept in the page's `localStorage`, there being no disk.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
# The shell's windowless driver: a gesture seen on a phone, replayed through the shell.
frus-shell = { path = "../frus-shell", features = ["testing"] }
# Measuring a word a frame painted, to say where its middle is.
frus-text = { path = "../frus-text" }

# --- Android packaging (cargo-apk) ---
[package.metadata.android]
package = "com.frus.demo"
build_targets = ["aarch64-linux-android"]
# The launch theme lives here — see `res/values/styles.xml`.
resources = "res"

[package.metadata.android.application]
label = "frus demo"
# The launcher icon: the frus logo by default, `res/mipmap-*/ic_launcher.png` — replace those
# five files to change it. (On Android the icon is the manifest's, not the running code's.)
icon = "@mipmap/ic_launcher"

# The application's own theme, whose only job is the **window background**: what is on
# screen between Android opening the window and the first frame being drawn. Left to the
# platform's, a dark application opens with a full-screen white flash on a device in
# light mode. See `res/values/styles.xml`; it is NoActionBar, which matters for the safe
# area as well (milestone 288).
theme = "@style/LaunchTheme"

# `frusdemo://task/3` opens the task's screen (milestone 563): a link with the application's own
# scheme, from a browser, a mail or `adb shell am start -a android.intent.action.VIEW -d ...`.
# Only the launch is read; a link opened while the demo runs is not forwarded to it.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [{ scheme = "frusdemo" }]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
