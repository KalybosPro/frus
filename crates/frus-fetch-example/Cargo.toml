[package]
name = "frus-fetch-example"
description = "frus — a networking example: loading an API with Command::perform_async + fetch (loading/error/data states)"
edition.workspace = true
version.workspace = true
license.workspace = true

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# **A single dependency** — the `frus` facade, with the `net` feature for the `fetch`
# helper and the `Request` builder. Nothing else to declare, wasm-bindgen for the Web
# aside.
frus = { path = "../frus", features = ["net"] }

# Web (wasm): the `frus::main!` macro generates the `#[wasm_bindgen(start)]` entry point.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Android packaging (cargo-apk) ---
[package.metadata.android]
package = "com.frus.fetch"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application]
label = "frus fetch"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
