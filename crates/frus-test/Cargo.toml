[package]
name = "frus-test"
description = "frus test tooling: headless rendering, snapshots, goldens"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/frus-test"
keywords = ["gui", "testing", "golden", "snapshot", "headless"]
categories = ["development-tools::testing", "gui"]

[dependencies]
frus-core = { path = "../frus-core", version = "0.4" }
frus-gpu = { path = "../frus-gpu", version = "0.4" }
frus-widgets = { path = "../frus-widgets", version = "0.4" }
# Reading and writing the reference images, that is, the goldens.
png = "0.17"

[dev-dependencies]
# SVG pictures, painted by frus and by the reference rasteriser of the parser it uses.
frus-svg = { path = "../frus-svg" }
resvg = { version = "0.48", default-features = false }
# Lottie animations, drawn on the GPU.
frus-lottie = { path = "../frus-lottie" }
