[package]
name = "frus-bench"
description = "frus performance harness: what a frame costs on the CPU"
edition.workspace = true
version.workspace = true
license.workspace = true
# A measuring instrument, not a shipped crate.
publish = false

[dependencies]
frus-core = { path = "../frus-core" }
frus-gpu = { path = "../frus-gpu" }
frus-text = { path = "../frus-text" }
frus-widgets = { path = "../frus-widgets" }

[dev-dependencies]
# `plotters` and its HTML reports are left out: the numbers go to the terminal and
# into a milestone note, and the dependency tree stays small enough to build on a
# phone-sized machine.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "scene"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "batch"
harness = false
