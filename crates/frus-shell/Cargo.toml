[package]
name = "frus-shell"
description = "frus — couche plateforme : fenêtre + boucle d'événements (Jalon 0)"
edition.workspace = true
version.workspace = true
license.workspace = true

# La feature `net` active le helper HTTP `fetch` cross-plateforme (client `ureq` en natif,
# `fetch` du navigateur sur le Web). Désactivée par défaut : une app qui ne réseau pas
# n'embarque ni ureq ni sa pile TLS.
# La feature `json` (implique `net`) ajoute `Request::json_body` / `send_json` via serde.
[features]
net = ["dep:ureq"]
json = ["net", "dep:serde", "dep:serde_json"]

# Alias de `cfg` (`desktop` / `android` / `ios` / `web`) — voir `build.rs`. Déjà dans
# l'arbre (winit s'en sert), donc aucune dépendance supplémentaire à télécharger.
[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
frus-gpu = { path = "../frus-gpu" }
frus-widgets = { path = "../frus-widgets" }
winit.workspace = true
anyhow.workspace = true
log.workspace = true
# JSON typé du helper `fetch` (feature `json`) : sérialisation/désérialisation. Pur Rust,
# donc valable sur les trois cibles (contrairement à ureq, natif seulement).
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Horloge monotone portable : `std::time` en natif, `performance.now()` sur le Web
# (où `std::time::Instant` panique). Une seule API pour les trois plateformes.
web-time = "1"

# Natif (bureau + Android) : attente bloquante de l'init GPU. Le Web, lui, est
# asynchrone (voir `run_web`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
# Client HTTP natif du helper `fetch` (feature `net`) : bloquant, mené à terme dans
# le corps de la future asynchrone (sur son thread dédié). TLS via rustls (défaut ureq).
ureq = { version = "2", optional = true }

# Bureau uniquement (ni Android, ni iOS, ni Web) : presse-papier, logger console et
# accessibilité. (AccessKit expose l'arbre sémantique aux lecteurs d'écran natifs —
# UIA Windows, AT-SPI Linux, macOS ; les providers Android et Web sont distincts.)
#
# iOS est exclu explicitement : `arboard` (presse-papier de bureau) et
# `accesskit_winit` n'ont pas de backend UIKit, et stderr n'est pas lisible sur
# appareil. Cargo n'évalue pas les alias de `build.rs` ici — d'où la liste écrite
# en toutes lettres.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard.workspace = true
env_logger.workspace = true
accesskit = "0.24"
accesskit_winit = "0.33"

# Web (wasm32 + WebGPU) : point d'entrée navigateur, futures JS, logs console.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
# `Request`/`RequestInit`/`Headers`/`Abort*` : helper HTTP `fetch` (feature `net`) sur le Web.
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Response",
    "Request",
    "RequestInit",
    "Headers",
    "AbortController",
    "AbortSignal",
] }

# Sur Android, winit passe par l'activité native (android-activity) et les logs
# vont dans logcat.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.14"
# Pont de saisie (InputConnection) : chargement du dex embarqué + natives.
jni = "0.21"
