[package]
name = "frus-shell"
description = "frus — couche plateforme : fenêtre + boucle d'événements (Jalon 0)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
frus-gpu = { path = "../frus-gpu" }
frus-widgets = { path = "../frus-widgets" }
winit.workspace = true
pollster.workspace = true
anyhow.workspace = true
log.workspace = true

# Presse-papier + logger console + accessibilité : bureau uniquement.
# (AccessKit expose l'arbre sémantique aux lecteurs d'écran natifs — UIA
# Windows, AT-SPI Linux, macOS ; le provider Android est un chantier distinct.)
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true
env_logger.workspace = true
accesskit = "0.24"
accesskit_winit = "0.33"

# Sur Android, winit passe par l'activité native (android-activity) et les logs
# vont dans logcat.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.14"
# Pont de saisie (InputConnection) : chargement du dex embarqué + natives.
jni = "0.21"
