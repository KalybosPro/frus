[package]
name = "frus-widgets"
description = "frus — declarative widget tree"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/frus-widgets"
keywords = ["gui", "widgets", "material", "declarative", "wgpu"]
categories = ["gui"]

# The **bundled fonts** are forwarded from `frus-text` (milestone 292) so that an
# application can drop the faces it does not ship through the facade alone:
#   frus = { version = "0.4", default-features = false, features = ["bundled-sans"] }
[features]
default = ["frus-text/default", "images"]
# Hot reload under `frus run`: each component's `build` is called through subsecond's jump
# table, so a patched build is the one that runs. Development only; `frus run` turns it on.
hot-reload = ["dep:subsecond"]
# Decoding embedded PNG/JPEG bytes, for `Image::memory` and `asset!`. On by default and
# droppable: without it those two report a missing decoder rather than panicking, exactly
# as dropping a bundled font leaves text to fall back rather than crash.
images = ["dep:frus-image"]
# SVG pictures (`SvgPicture`), drawn as vector paths. Off by default: the parser is weight an
# application without SVG artwork should not carry.
svg = ["dep:frus-svg"]
# Lottie animations (`Lottie`), drawn as vector paths. Off by default, as `svg` is.
lottie = ["dep:frus-lottie"]
bundled-sans = ["frus-text/bundled-sans"]
bundled-italic = ["frus-text/bundled-italic"]
bundled-mono = ["frus-text/bundled-mono"]
bundled-arabic = ["frus-text/bundled-arabic"]
# The **variant icon styles**. The filled set is always bundled; each of these adds one
# more blob of artwork (~340, ~400 and ~270 KiB), which is why none is on by default.
# Without one, its constants do not exist and `Icons::by_name` answers `None` for its
# names rather than quietly handing back a different drawing.
icons-outlined = []
icons-rounded = []
icons-sharp = []

[dependencies]
subsecond = { version = "0.7", optional = true }
frus-core = { path = "../frus-core", version = "0.4" }
frus-image = { path = "../frus-image", version = "0.4", optional = true }
frus-svg = { path = "../frus-svg", version = "0.4", optional = true }
frus-lottie = { path = "../frus-lottie", version = "0.4", optional = true }
frus-layout = { path = "../frus-layout", version = "0.4" }
frus-text = { path = "../frus-text", version = "0.4", default-features = false }
typed-arena = { workspace = true }
# An image that cannot be decoded says so in the console, once.
log.workspace = true

[dev-dependencies]
# Encoding a tiny PNG in-test, so the image tests carry no binary fixture.
png = "0.17"
