<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frus — hello (Web / WebGPU)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0d14; overflow: hidden; }
      /* winit appends its canvas to <body>; we make it fill the window. */
      canvas { display: block; width: 100vw; height: 100vh; }
      #unsupported {
        color: #e6e6ef; font: 15px/1.5 system-ui, sans-serif; padding: 24px; max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <div id="unsupported" hidden>
      <h2>WebGPU unavailable</h2>
      <p>frus renders through <strong>WebGPU</strong>. Open this page in a recent
      browser — Chrome or Edge 113+, or Firefox with WebGPU enabled — over
      <code>https</code> or <code>localhost</code>.</p>
    </div>
    <script type="module">
      if (!('gpu' in navigator)) {
        document.getElementById('unsupported').hidden = false;
      } else {
        // The wasm-bindgen module; `start()` (#[wasm_bindgen(start)]) runs on init.
        import('./pkg/frus_hello.js').then((m) => m.default());
      }
    </script>
  </body>
</html>
