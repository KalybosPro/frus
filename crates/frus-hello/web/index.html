<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frus — hello (Web)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0d14; overflow: hidden; }
      /* winit appends its canvas to <body>; it fills the part of the window the page is given,
         and follows it when the browser's own bars come and go. Not 100vh: on a phone that is
         the height with the address bar hidden, which a page that does not scroll never hides,
         and the bottom of the application was cut off. */
      canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

      #chrome {
        position: fixed; top: 0; left: 0; right: 0; z-index: 2;
        display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
        padding: 0.6rem 1rem;
        font: 14px/1.4 system-ui, sans-serif; color: #e6e6ef;
        background: linear-gradient(#0d0d14cc, #0d0d1400);
        pointer-events: none;
      }
      #chrome h1 { margin: 0; font-size: 15px; font-weight: 600; }
      #chrome p { margin: 0; color: #a3a3b3; }
      #chrome a { color: #9fd3ff; pointer-events: auto; }

      #loading, #unsupported {
        position: fixed; inset: 0; z-index: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 0.9rem; text-align: center;
        color: #e6e6ef; font: 15px/1.5 system-ui, sans-serif; padding: 24px;
      }
      #unsupported { max-width: 40rem; margin: 0 auto; }
      #unsupported p { white-space: pre-line; }
      #loading[hidden], #unsupported[hidden] { display: none; }

      #spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #33334a; border-top-color: #9fd3ff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header id="chrome">
      <h1>frus — hello</h1>
      <p>A counter, running through WebGPU (or WebGL 2) with no build step beyond <code>wasm-bindgen</code>.</p>
      <a href="https://github.com/frus-rs/frus">Source on GitHub →</a>
    </header>

    <div id="loading" role="status" aria-live="polite">
      <div id="spinner" aria-hidden="true"></div>
      <p>Loading the application…</p>
    </div>

    <div id="unsupported" hidden>
      <h2>The application cannot draw here</h2>
      <p></p>
    </div>

    <script type="module">
      const loading = document.getElementById('loading');
      const unsupported = document.getElementById('unsupported');
      const fail = (title, text) => {
        loading.hidden = true;
        unsupported.querySelector('h2').textContent = title;
        unsupported.querySelector('p').textContent = text;
        unsupported.hidden = false;
      };

      // When nothing can be drawn — the browser offers neither WebGPU nor WebGL 2 — the
      // application says why through this event, and the page shows it.
      window.addEventListener('frus-error', (event) => {
        event.preventDefault();
        fail('The application cannot draw here', event.detail);
      });

      // The wasm-bindgen module; `start()` (#[wasm_bindgen(start)]) runs on init. It draws
      // through WebGPU where the browser offers it, and through WebGL 2 elsewhere.
      import('./pkg/frus_hello.js')
        .then((m) => m.default())
        .then(() => { loading.hidden = true; })
        .catch((err) => fail(
          'Could not load the application',
          'Fetching or starting the wasm module failed: ' + err + '. Check the console, ' +
          'and that crates/frus-hello/web/pkg/ has been built (see web/README.md).'));
    </script>
  </body>
</html>
