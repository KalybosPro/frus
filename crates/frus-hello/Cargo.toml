[package]
name = "frus-hello"
description = "frus — la plus petite application (compteur) : le point de départ canonique"
edition.workspace = true
version.workspace = true
license.workspace = true

# Bibliothèque : `rlib` pour le binaire bureau, `cdylib` (le `.so`) pour Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Le point d'entrée unique `frus_shell::main!` ré-exporte anyhow/log : l'app n'a pas à
# les déclarer.
frus-shell = { path = "../frus-shell" }
frus-widgets = { path = "../frus-widgets" }

# Web (wasm) : la macro `frus_shell::main!` engendre l'entrée `#[wasm_bindgen(start)]`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Empaquetage Android (cargo-apk) ---
[package.metadata.android]
package = "com.frus.hello"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application]
label = "frus hello"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
