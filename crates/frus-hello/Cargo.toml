[package]
name = "frus-hello"
description = "frus — the smallest application, a counter: the canonical starting point"
edition.workspace = true
version.workspace = true
license.workspace = true

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# **A single dependency**: the `frus` facade re-exports the shell, the widgets and
# `main!` — plus anyhow and log. An app declares nothing else, wasm-bindgen for the Web
# aside.
frus = { path = "../frus" }

# Web (wasm): the `frus::main!` macro generates the `#[wasm_bindgen(start)]` entry point.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Android packaging (cargo-apk) ---
[package.metadata.android]
package = "com.frus.hello"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application]
label = "frus hello"

# No system title bar: the framework draws its own app bar, and a theme that keeps
# one makes Android report a content rect 56dp shorter than the window — which the
# shell reads as a safe-area inset and pads a second time. See milestone 288.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34
