[package]
name = "frus-gpu"
description = "frus — GPU context and 2D rendering engine (Milestone 0)"
edition.workspace = true
version.workspace = true
license.workspace = true

# The **bundled fonts** are forwarded from `frus-text` (milestone 292) so that an
# application can drop the faces it does not ship through the facade alone:
#   frus = { version = "0.1", default-features = false, features = ["bundled-sans"] }
[features]
default = ["frus-text/default"]
bundled-sans = ["frus-text/bundled-sans"]
bundled-italic = ["frus-text/bundled-italic"]
bundled-mono = ["frus-text/bundled-mono"]
bundled-arabic = ["frus-text/bundled-arabic"]

[dependencies]
frus-core = { path = "../frus-core" }
frus-text = { path = "../frus-text", default-features = false }
wgpu.workspace = true
glyphon.workspace = true
bytemuck.workspace = true
# Vector path tessellation (fill/stroke) → GPU triangles.
lyon.workspace = true
anyhow.workspace = true
log.workspace = true
# Blocking wait on device init: offscreen rendering has no async loop.
pollster.workspace = true
