<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>authentication</title>
    <style>
      /* The background is the application's first frame's, as on Android: #121418 is the
         default dark theme's. */
      html, body { margin: 0; height: 100%; background: #121418; overflow: hidden; }
      /* winit appends its canvas to <body>; it fills the part of the window the page is given,
         and follows it when the browser's own bars come and go. Not 100vh: on a phone that is
         the height with the address bar hidden, which a page that does not scroll never hides,
         and the bottom of the application was cut off. */
      canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

      #status {
        /* Over the canvas, which is fixed too and comes after it. */
        position: fixed; inset: 0; z-index: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 0.9rem; padding: 24px; text-align: center;
        color: #e6e6ef; font: 15px/1.5 system-ui, sans-serif;
      }
      #status[hidden] { display: none; }
      /* The error's details come on their own paragraph. */
      #message { white-space: pre-line; max-width: 40rem; }
      #spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #33334a; border-top-color: #9fd3ff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="status" role="status" aria-live="polite">
      <div id="spinner" aria-hidden="true"></div>
      <p id="message">Loading…</p>
    </div>

    <script type="module">
      const status = document.getElementById('status');
      const message = document.getElementById('message');
      let failed = false;
      const fail = (text) => {
        failed = true;
        document.getElementById('spinner').hidden = true;
        message.textContent = text;
        status.hidden = false;
      };

      // When nothing can be drawn — the browser offers neither WebGPU nor WebGL 2 — the
      // application says why through this event, and the page shows it.
      window.addEventListener('frus-error', (event) => {
        event.preventDefault();
        fail(event.detail);
      });

      // The module wasm-bindgen wrote; its `start()` runs the application on init. It draws
      // through WebGPU where the browser offers it, and through WebGL 2 elsewhere.
      import('./pkg/authentication.js')
        .then((module) => module.default())
        .then(() => { if (!failed) status.hidden = true; })
        .catch((err) => fail('The application could not start: ' + err));
    </script>
  </body>
</html>
