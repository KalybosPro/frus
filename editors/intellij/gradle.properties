# The plugin's version: a tag `intellij-v<version>` publishes it (.github/workflows/intellij.yml).
pluginVersion = 0.1.0

# The oldest IDE build the plugin installs in: 2025.1 (Android Studio Narwhal, IntelliJ IDEA and
# RustRover 2025.1). There is no newest one: it is checked against new IDEs as they come out.
pluginSinceBuild = 251

# The IDE it is built and tested against. Unset, the Android Studio release named below is
# downloaded; `-PlocalIde=<folder>` builds against an installed IDE instead (no download).
androidStudioVersion = 2025.3.1.7

# The IDE provides the Kotlin standard library: the plugin must not bring its own.
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
